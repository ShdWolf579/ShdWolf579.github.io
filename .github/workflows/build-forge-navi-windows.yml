name: Build Forge-Navi Windows

on:
  push:
    branches: [main]
    paths:
      - "community/forge-navi/forge_navi_community.py"
      - "community/forge-navi/forge_navi_desktop.py"
      - "community/forge-navi/token_navi_community.py"
      - "community/forge-navi/demo/**"
      - ".github/workflows/build-forge-navi-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build standalone desktop executable
        shell: pwsh
        run: |
          Set-Location community/forge-navi
          pyinstaller --noconfirm --clean --onefile --windowed --name Forge-Navi-Community --add-data "demo;demo" forge_navi_desktop.py
          New-Item -ItemType Directory -Force -Path dist-public | Out-Null
          Copy-Item dist/Forge-Navi-Community.exe dist-public/Forge-Navi-Community.exe -Force

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forge-Navi-Community-Windows
          path: community/forge-navi/dist-public/Forge-Navi-Community.exe
          if-no-files-found: error

      - name: Publish executable into portfolio downloads
        shell: pwsh
        run: |
          $target = "community/forge-navi/dist"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item "community/forge-navi/dist-public/Forge-Navi-Community.exe" "$target/Forge-Navi-Community.exe" -Force
          $hash = (Get-FileHash "$target/Forge-Navi-Community.exe" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$target/SHA256.txt" -Value "$hash  Forge-Navi-Community.exe"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target/Forge-Navi-Community.exe" "$target/SHA256.txt"
          if (git diff --cached --quiet) {
            Write-Host "Executable is unchanged."
          } else {
            git commit -m "Build Forge-Navi Community Windows executable"
            git pull --rebase origin main
            git push origin HEAD:main
          }
