name: Build Forge-Navi Windows Dev
# dev-build-revision: 3

on:
  push:
    branches: [forge-navi-v0.3-dev]
    paths:
      - "community/forge-navi/forge_navi_community.py"
      - "community/forge-navi/forge_navi_desktop.py"
      - "community/forge-navi/forge_navi_scripter.py"
      - "community/forge-navi/test_community_core.py"
      - "community/forge-navi/token_navi_community.py"
      - "community/forge-navi/demo/**"
      - ".github/workflows/build-forge-navi-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Community Core tests
        shell: pwsh
        run: |
          Set-Location community/forge-navi
          python -m unittest -v test_community_core.py

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build standalone desktop executable
        shell: pwsh
        run: |
          Set-Location community/forge-navi
          pyinstaller --noconfirm --clean --onefile --windowed --name Forge-Navi-Community-v0.3-dev --add-data "demo;demo" forge_navi_desktop.py
          New-Item -ItemType Directory -Force -Path dist-public | Out-Null
          Copy-Item dist/Forge-Navi-Community-v0.3-dev.exe dist-public/Forge-Navi-Community-v0.3-dev.exe -Force

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forge-Navi-Community-v0.3-dev-Windows
          path: community/forge-navi/dist-public/Forge-Navi-Community-v0.3-dev.exe
          if-no-files-found: error
