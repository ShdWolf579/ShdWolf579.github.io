name: Release Spotify sorter v0.8.7

on:
  push:
    paths:
      - '.github/workflows/release-spotify-v087.yml'

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'Stage Spotify v0.8.7 assembler')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild tested userscript
        shell: bash
        run: |
          cat .release/v087/chunk00.b64 .release/v087/chunk01.b64 .release/v087/chunk02.b64 \
            | base64 -d \
            | gzip -d \
            > spotify-liked-sorter.user.js
          grep -Fq '// @version      0.8.7' spotify-liked-sorter.user.js
          test "$(wc -c < spotify-liked-sorter.user.js)" -eq 69695

      - name: Update project page
        shell: bash
        run: |
          sed -i 's/v0\.8\.3/v0.8.7/g' things-i-made.html
          grep -Fq 'USERSCRIPT • v0.8.7' things-i-made.html

      - name: Remove staging payload and publish
        shell: bash
        run: |
          rm -rf .release/v087
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Spotify Liked Songs sorter v0.8.7'
          git push origin HEAD:main
