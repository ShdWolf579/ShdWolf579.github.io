name: Publish Spotify sorter v0.8.8

on:
  push:
    paths:
      - '.github/workflows/release-spotify-v088-run.yml'

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'Stage Spotify v0.8.8 assembler')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild exact tested userscript
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release/spotify-v088.gz.b64 | gzip -d > spotify-liked-sorter.user.js
          echo '486d2f4959f5ada8d1ba91f3ccfc6fb6dacceb3d4273d164ab3a7251b5c7541c  spotify-liked-sorter.user.js' | sha256sum -c -
          grep -Fq '// @version      0.8.8' spotify-liked-sorter.user.js
          test "$(wc -c < spotify-liked-sorter.user.js)" -eq 71183

      - name: Update project page
        shell: bash
        run: |
          sed -i 's/v0\.8\.7/v0.8.8/g' things-i-made.html
          grep -Fq 'USERSCRIPT • v0.8.8' things-i-made.html

      - name: Remove staging payload and publish
        shell: bash
        run: |
          rm -f .release/spotify-v088.gz.b64
          rmdir .release 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Spotify Liked Songs sorter v0.8.8'
          git push origin HEAD:main
