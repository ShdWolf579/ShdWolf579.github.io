name: Release Spotify sorter v0.8.8

on:
  push:
    paths:
      - '.github/workflows/release-spotify-v088.yml'

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'Run Spotify v0.8.8 release')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble exact tested userscript
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release/spotify-v088.gz.b64 | gzip -d > spotify-liked-sorter.user.js
          echo "486d2f4959f5ada8d1ba91f3ccfc6fb6dacceb3d4273d164ab3a7251b5c7541c  spotify-liked-sorter.user.js" | sha256sum -c -
          grep -Fq '// @version      0.8.8' spotify-liked-sorter.user.js

      - name: Bump portfolio version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('things-i-made.html')
          s = p.read_text(encoding='utf-8')
          old = 'USERSCRIPT • v0.8.7'
          new = 'USERSCRIPT • v0.8.8'
          if old not in s:
              raise SystemExit(f'Expected portfolio marker not found: {old}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove staging payload and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .release/spotify-v088.gz.b64
          rmdir .release 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Spotify Liked Songs sorter v0.8.8'
          git push origin HEAD:main
